data:
  train_path: data/raw/train.csv
  later_path: data/raw/later.csv
  holdout_path: data/raw/holdout_features.csv
  target: occupancy_pct
  leakage_columns:
    - tickets_scanned_pct

training:
  test_size: 0.2
  random_state: 42
  shuffle: true

evaluation:
  metric: MAE

models:
  - name: linear_regression
    type: LinearRegression

  - name: random_forest
    type: RandomForestRegressor
    n_estimators: 100
    max_depth: 10

  - name: gradient_boosting
    type: GradientBoostingRegressor
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3

mlflow:
  experiment_name: cinema-occupancy
  tracking_uri: sqlite:///mlflow.db
  registered_model_name: cinema-occupancy-model
  model_alias: champion
